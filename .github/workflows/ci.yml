# Tests del backend en cada push y PR a develop/main.
# No usa secretos reales: los tests levantan su propia MariaDB (Testcontainers), simulan el envío de correo
# y no llaman a Stripe ni a Google, así que bastan valores de mentira y un keystore JWT de usar y tirar.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DB_URL: jdbc:mariadb://localhost:3306/unused   # Testcontainers la sustituye por la suya
      DB_USER: unused
      DB_PASSWORD: unused
      DB_DRIVER: org.mariadb.jdbc.Driver
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_KEYSTORE_PATH: ${{ github.workspace }}/ci-jwt.jks
      JWT_KEYSTORE_PASSWORD: ci-keystore-pass

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generar keystore JWT de prueba
        run: >
          keytool -genkeypair -alias jwt-keypair -keyalg RSA -keysize 2048 -validity 1
          -dname "CN=Valkyria CI" -storetype JKS -keystore "$JWT_KEYSTORE_PATH"
          -storepass "$JWT_KEYSTORE_PASSWORD" -keypass "$JWT_KEYSTORE_PASSWORD"

      - name: Tests
        run: ./mvnw -B verify
