# Valkyria - producción
#
# Estructura esperada en el servidor (~/valkyria):
#   compose.yaml                copia de este fichero (la hace deploy.sh)
#   deploy.sh                   copia de deploy/deploy.sh
#   .env                        configuración de este servidor (permisos 600), ver abajo
#   backend.env                 secretos del backend (permisos 600)
#   backend/certs/              keystore del JWT
#   data/uploads/               imágenes subidas
#   backend/valkyria-backend/   clon del repo del backend
#   frontend/valkyria-frontend/ clon del repo del frontend
#
# Variables del .env:
#   PUBLIC_URL        URL pública de la web, sin barra final (p. ej. https://valkyriafest.es). Obligatoria
#   VALKYRIA_VERSION  versión desplegada (p. ej. 1.6.0). La escribe deploy.sh; no editarla a mano
#   DB_ROOT_PASSWORD, DB_DATABASE, DB_USER, DB_USER_PASSWORD
#
# Las imágenes del backend y del frontend no se construyen aquí: las publica GitHub Actions en GHCR
# (ghcr.io/asa7ur/...) al crear el tag de cada versión.
#
# Los puertos 4200 y 8080 solo escuchan en 127.0.0.1: desde fuera únicamente se llega a través del nginx
# de esta misma máquina.
#
# NUNCA usar "docker compose down -v": borra el volumen con la base de datos.

name: valkyria

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ghcr.io/asa7ur/valkyria-frontend:${VALKYRIA_VERSION:?Falta VALKYRIA_VERSION en el .env}
    container_name: frontend
    ports:
      - "127.0.0.1:4200:80"
    restart: unless-stopped
    logging: *logging

  backend:
    image: ghcr.io/asa7ur/valkyria-backend:${VALKYRIA_VERSION:?Falta VALKYRIA_VERSION en el .env}
    container_name: backend
    env_file:
      - ./backend.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_URL: ${PUBLIC_URL:?Falta PUBLIC_URL en el .env}
      APP_BACKEND_URL: ${PUBLIC_URL:?Falta PUBLIC_URL en el .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Falta PUBLIC_URL en el .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/certs:/app/certs:ro
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  db:
    # Versión fijada: la misma con la que se creó el volumen de datos
    image: mariadb:12.2
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_USER_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

volumes:
  database_data:
