services:
  db:
    # Versión fijada (la misma que usan los tests): con 'latest' una actualización podía romper el volumen
    image: mariadb:12.2
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    ports:
      # Solo accesible desde esta máquina, no desde la red
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: