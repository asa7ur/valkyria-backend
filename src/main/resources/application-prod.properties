# Perfil de producción: activar con SPRING_PROFILES_ACTIVE=prod
# Sin datos de prueba (db/seed contiene usuarios con contraseñas conocidas)
spring.flyway.locations=classpath:db/migration

# Logs: nada de DEBUG (los mensajes de depuración incluyen emails y datos de pedidos)
logging.level.root=INFO
logging.level.org.iesalixar.daw2.GarikAsatryan.valkyria=INFO
logging.level.org.springframework.web=WARN

# Documentación de la API desactivada: expone todos los endpoints y sus modelos
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
